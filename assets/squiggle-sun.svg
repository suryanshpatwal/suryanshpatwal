<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 18" width="180" height="18" aria-hidden="true">
<style>
text{font-family:'GS','Google Sans','Segoe UI',Helvetica,Arial,sans-serif}
.float{animation:float 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.float.slow{animation-duration:8s}.float.fast{animation-duration:4.6s}
.float.d1{animation-delay:-1.5s}.float.d2{animation-delay:-3s}.float.d3{animation-delay:-4.5s}
.twinkle{animation:twinkle 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.twinkle.d1{animation-delay:-.8s}.twinkle.d2{animation-delay:-1.6s}
.draw{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.4s .4s cubic-bezier(.65,0,.35,1) forwards}
.rise{animation:rise .9s cubic-bezier(.16,1,.3,1) both}.rise.d1{animation-delay:.12s}.rise.d2{animation-delay:.3s}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(6deg)}}
@keyframes twinkle{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.55);opacity:.5}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.draw{stroke-dashoffset:0}}
</style>
<g transform="translate(2 1) scale(0.7333333333333333 1)"><path class="draw" d="M3 9 C 18 1, 28 1, 43 9 S 68 17, 83 9 S 108 1, 123 9 S 148 17, 163 9 S 188 1, 203 9 S 228 17, 237 9" fill="none" stroke="#FFC23D" stroke-width="4.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/></g>
</svg>